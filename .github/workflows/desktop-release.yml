name: LOELSTI App Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RELEASE_TAG: loelsti-v${{ github.run_number }}

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis
      - name: Locate Windows installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Windows NSIS installer not found.' }
          Copy-Item $exe.FullName LOELSTI-Windows.exe
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: loelsti-windows
          path: LOELSTI-Windows.exe
          if-no-files-found: error
          retention-days: 1

  publish-windows:
    name: Publish Windows release
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: loelsti-windows
          path: release-assets
      - name: Create or update Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LOELSTI ${{ env.RELEASE_TAG }}
          body: LOELSTI Windows Release
          draft: false
          prerelease: false
          files: release-assets/LOELSTI-Windows.exe
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Initialize Android project
        working-directory: apps/desktop
        run: npm run tauri -- android init --ci
      - name: Build Android APK
        working-directory: apps/desktop
        run: npm run tauri -- android build --apk
      - name: Locate Android APK
        shell: bash
        run: |
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" LOELSTI-Android.apk
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loelsti-android
          path: LOELSTI-Android.apk
          if-no-files-found: error
          retention-days: 1

  publish-android:
    name: Publish Android APK
    runs-on: ubuntu-latest
    needs: android
    if: ${{ needs.android.result == 'success' }}
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: loelsti-android
          path: release-assets
      - name: Create Android-only release fallback
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.RELEASE_TAG }}
          name: LOELSTI Android ${{ env.RELEASE_TAG }}
          body: LOELSTI Android Release
          draft: false
          prerelease: false
          files: release-assets/LOELSTI-Android.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
