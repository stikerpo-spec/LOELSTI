name: LOELSTI App Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: loelsti-release
  cancel-in-progress: false

env:
  RELEASE_TAG: loelsti-v${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: LOELSTI ${{ env.RELEASE_TAG }}
          releaseBody: LOELSTI Desktop Release
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
      - name: Create stable Windows download files
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          $msi = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/msi -Filter *.msi -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Windows EXE installer not found.' }
          if (-not $msi) { throw 'Windows MSI installer not found.' }
          Copy-Item $exe.FullName LOELSTI-Windows.exe
          Copy-Item $msi.FullName LOELSTI-Windows.msi
      - name: Publish stable Windows files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            LOELSTI-Windows.exe
            LOELSTI-Windows.msi
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Install dependencies
        run: npm install
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Initialize Android project
        working-directory: apps/desktop
        run: npm run tauri -- android init --ci
      - name: Build Android APK
        working-directory: apps/desktop
        run: npm run tauri -- android build --apk
      - name: Find APK
        shell: bash
        run: |
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" LOELSTI-Android.apk
      - name: Upload Android APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: LOELSTI-Android.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
