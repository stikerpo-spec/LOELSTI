name: LOELSTI App Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  RELEASE_TAG: loelsti-v${{ github.run_number }}
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set release version
        shell: pwsh
        run: |
          $path = 'apps/desktop/src-tauri/tauri.conf.json'
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.version = '${{ env.APP_VERSION }}'
          $json | ConvertTo-Json -Depth 20 | Set-Content $path
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Build Windows installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis
      - name: Locate Windows installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer not found.' }
          Copy-Item $exe.FullName LOELSTI-Windows.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: loelsti-windows
          path: LOELSTI-Windows.exe
          if-no-files-found: error
          retention-days: 1

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set release version
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = 'apps/desktop/src-tauri/tauri.conf.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = '${{ env.APP_VERSION }}'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
      - name: Generate app icons
        working-directory: apps/desktop
        run: npm run tauri -- icon src-tauri/app-icon.svg
      - name: Initialize Android project
        working-directory: apps/desktop
        run: npm run tauri -- android init --ci
      - name: Build Android APK
        working-directory: apps/desktop
        run: npm run tauri -- android build --apk
      - name: Locate Android APK
        shell: bash
        run: |
          APK=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo 'Android APK not found.'; exit 1; fi
          cp "$APK" LOELSTI-Android.apk
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: loelsti-android
          path: LOELSTI-Android.apk
          if-no-files-found: error
          retention-days: 1

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Set release version
        shell: bash
        run: |
          python - <<'PY'
          import json
          path = 'apps/desktop/src-tauri/tauri.conf.json'
          with open(path, encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = '${{ env.APP_VERSION }}'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
      - name: Generate app icons
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.0 icon src-tauri/app-icon.svg
      - name: Initialize iOS project
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.0 ios init --ci
      - name: Build iOS IPA without signing
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.11.0 ios build --ci --no-sign
      - name: Locate iOS IPA
        shell: bash
        run: |
          IPA=$(find apps/desktop/src-tauri/gen/apple/build -type f -name '*.ipa' | head -n 1)
          if [ -z "$IPA" ]; then echo 'iOS IPA not found.'; exit 1; fi
          cp "$IPA" LOELSTI-iOS.ipa
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: loelsti-ios
          path: LOELSTI-iOS.ipa
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish complete LOELSTI release
    runs-on: ubuntu-latest
    needs: [windows, android, ios]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: loelsti-windows
          path: release-assets
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: loelsti-android
          path: release-assets
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: loelsti-ios
          path: release-assets
      - name: Verify release files
        shell: bash
        run: |
          test -s release-assets/LOELSTI-Windows.exe
          test -s release-assets/LOELSTI-Android.apk
          test -s release-assets/LOELSTI-iOS.ipa
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LOELSTI ${{ env.APP_VERSION }}
          body: LOELSTI platform release with Windows, Android and iOS builds.
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-assets/LOELSTI-Windows.exe
            release-assets/LOELSTI-Android.apk
            release-assets/LOELSTI-iOS.ipa
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          response=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/stikerpo-spec/LOELSTI/releases/tags/${RELEASE_TAG}")
          printf '%s' "$response" | jq -e '[.assets[].name] | index("LOELSTI-Windows.exe") != null' >/dev/null
          printf '%s' "$response" | jq -e '[.assets[].name] | index("LOELSTI-Android.apk") != null' >/dev/null
          printf '%s' "$response" | jq -e '[.assets[].name] | index("LOELSTI-iOS.ipa") != null' >/dev/null
